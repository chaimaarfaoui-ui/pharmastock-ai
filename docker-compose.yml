services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pharma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-pharmastock}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pharma}"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pharma}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pharmastock}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      REDIS_URL: redis://redis:6379/0
      USE_CELERY: ${USE_CELERY:-false}
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]
  worker:   # only needed when USE_CELERY=true (not covered by the automated tests)
    build: ./backend
    command: celery -A app.worker.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pharma}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pharmastock}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    profiles: ["celery"]
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [backend]
    ports: ["3000:3000"]
volumes:
  pgdata:
